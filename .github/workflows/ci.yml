name: CI

on:
  push:
  pull_request: ~

jobs:
  prepare-base:
    name: Prepare base dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Restore base Python virtual environment
        id: cache-venv
        uses: actions/cache/restore@v4
        with:
          path: venv
          key: >-
            2-${{ runner.os }}-base-venv-${{
            matrix.python-version }}-${{
            hashFiles('pyproject.toml', 'Cargo.toml', 'src/lib.rs') }}
      - name: Install system dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Set up Rust
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Create Python virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv venv
          . venv/bin/activate
          uv pip install -U pip setuptools pre-commit setuptools-rust
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 uv pip install -e .[dev]
      - name: Cache base Python virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: venv
          key: ${{ steps.cache-venv.outputs.cache-primary-key }}

  pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    needs: prepare-base
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v6
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.10"
      - name: Restore base Python virtual environment
        id: cache-venv
        uses: actions/cache/restore@v4
        with:
          fail-on-cache-miss: true
          path: venv
          key: >-
            2-${{ runner.os }}-base-venv-3.10-${{
            hashFiles('pyproject.toml', 'Cargo.toml', 'src/lib.rs') }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Restore pre-commit environment from cache
        id: cache-precommit
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pre-commit
          key: |
            1-${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit dependencies
        if: steps.cache-precommit.outputs.cache-hit != 'true'
        run: |
          . venv/bin/activate
          pre-commit install-hooks
      - name: Cache pre-commit environment
        if: steps.cache-precommit.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.cache-precommit.outputs.cache-primary-key }}
      - name: Lint and static analysis
        run: |
          . venv/bin/activate
          pre-commit run --show-diff-on-failure --color=always --all-files

  build-ser2net:
    name: Build ser2net
    runs-on: ubuntu-latest
    env:
      SER2NET_VERSION: "4.6.7"
      GENSIO_VERSION: "3.0.2"
    steps:
      - name: Restore cached ser2net binary
        id: cache-ser2net
        uses: actions/cache/restore@v4
        with:
          path: ser2net
          key: ser2net-${{ env.SER2NET_VERSION }}-gensio-${{ env.GENSIO_VERSION }}
      - name: Install build dependencies
        if: steps.cache-ser2net.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make autoconf automake libtool pkg-config libyaml-dev
      - name: Build gensio
        if: steps.cache-ser2net.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 -b v$GENSIO_VERSION https://github.com/cminyard/gensio.git /tmp/gensio
          cd /tmp/gensio
          autoreconf -i
          ./configure \
            --prefix=/tmp/gensio-install \
            --enable-static \
            --disable-shared \
            --with-all-gensios=no \
            --with-net=yes \
            --with-telnet=yes \
            --with-serialdev=yes \
            --with-pthreads=yes \
            --without-openssl \
            --without-swig \
            --without-python \
            --without-tcl \
            --without-glib
          make -j$(nproc)
          mkdir -p /tmp/gensio-install/libexec/gensio/$GENSIO_VERSION
          make install
      - name: Build ser2net
        if: steps.cache-ser2net.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 -b v$SER2NET_VERSION https://github.com/cminyard/ser2net.git /tmp/ser2net
          cd /tmp/ser2net
          autoreconf -i
          LDFLAGS="-L/tmp/gensio-install/lib" \
          CFLAGS="-I/tmp/gensio-install/include" \
          CPPFLAGS="-I/tmp/gensio-install/include" \
          LIBS="-lgensioosh -lpthread" \
          ./configure --prefix=/usr/local --with-pam=no
          make -j$(nproc) LDFLAGS="-all-static -L/tmp/gensio-install/lib"
          cp ser2net $GITHUB_WORKSPACE/ser2net
      - name: Verify ser2net binary
        if: steps.cache-ser2net.outputs.cache-hit != 'true'
        run: |
          file $GITHUB_WORKSPACE/ser2net
          $GITHUB_WORKSPACE/ser2net -v
      - name: Cache ser2net binary
        if: steps.cache-ser2net.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ser2net
          key: ${{ steps.cache-ser2net.outputs.cache-primary-key }}

  compile-esphome:
    name: Compile ESPHome host daemon
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v6
      - name: Restore cached ESPHome binary
        id: cache-esphome
        uses: actions/cache/restore@v4
        with:
          path: tests/esphome/.esphome/build/serialx-host-daemon/.pioenvs/serialx-host-daemon/program
          key: >-
            1-esphome-daemon-${{
            hashFiles('tests/esphome/host_daemon.yaml', 'tests/esphome/external_components/**') }}
      - name: Set up Python 3.13
        if: steps.cache-esphome.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile ESPHome host daemon
        if: steps.cache-esphome.outputs.cache-hit != 'true'
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv esphome-venv
          . esphome-venv/bin/activate
          uv pip install 'git+https://github.com/esphome/esphome@3f143d9f19ae29a408f1024e202aa869e86a7787'
          esphome compile tests/esphome/host_daemon.yaml
      - name: Cache ESPHome binary
        if: steps.cache-esphome.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tests/esphome/.esphome/build/serialx-host-daemon/.pioenvs/serialx-host-daemon/program
          key: ${{ steps.cache-esphome.outputs.cache-primary-key }}

  build-tty0tty:
    name: Build tty0tty
    runs-on: ubuntu-latest
    env:
      TTY0TTY_COMMIT: "dac0a105bee6997ebb3a06441c7befe3164c9fd1"
    steps:
      - name: Get kernel version
        id: kernel
        run: echo "version=$(uname -r)" >> "$GITHUB_OUTPUT"
      - name: Restore cached tty0tty module
        id: cache-tty0tty
        uses: actions/cache/restore@v4
        with:
          path: tty0tty.ko
          key: tty0tty-${{ env.TTY0TTY_COMMIT }}-${{ steps.kernel.outputs.version }}
      - name: Build tty0tty
        if: steps.cache-tty0tty.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-headers-$(uname -r)
          git clone https://github.com/lcgamboa/tty0tty /tmp/tty0tty
          git -C /tmp/tty0tty checkout $TTY0TTY_COMMIT
          make -C /tmp/tty0tty/module
          cp /tmp/tty0tty/module/tty0tty.ko tty0tty.ko
      - name: Cache tty0tty module
        if: steps.cache-tty0tty.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tty0tty.ko
          key: ${{ steps.cache-tty0tty.outputs.cache-primary-key }}

  pytest:
    runs-on: ubuntu-latest
    needs: [prepare-base, compile-esphome, build-ser2net, build-tty0tty]
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    name: Run tests Python ${{ matrix.python-version }} (Linux)
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        id: python
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Restore base Python virtual environment
        id: cache-venv
        uses: actions/cache/restore@v4
        with:
          fail-on-cache-miss: true
          path: venv
          key: >-
            2-${{ runner.os }}-base-venv-${{
            matrix.python-version }}-${{
            hashFiles('pyproject.toml', 'Cargo.toml', 'src/lib.rs') }}
      - name: Restore cached ESPHome binary
        uses: actions/cache/restore@v4
        with:
          path: tests/esphome/.esphome/build/serialx-host-daemon/.pioenvs/serialx-host-daemon/program
          key: >-
            1-esphome-daemon-${{
            hashFiles('tests/esphome/host_daemon.yaml', 'tests/esphome/external_components/**') }}
      - name: Restore cached ser2net binary
        uses: actions/cache/restore@v4
        with:
          path: ser2net
          key: ser2net-4.6.7-gensio-3.0.2
      - name: Install ser2net
        run: |
          sudo install -m 755 ser2net /usr/local/bin/ser2net
          ser2net -v
      - name: Get kernel version
        id: kernel
        run: echo "version=$(uname -r)" >> "$GITHUB_OUTPUT"
      - name: Restore cached tty0tty module
        uses: actions/cache/restore@v4
        with:
          path: tty0tty.ko
          key: tty0tty-dac0a105bee6997ebb3a06441c7befe3164c9fd1-${{ steps.kernel.outputs.version }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y socat libudev-dev
      - name: Load tty0tty kernel module
        run: |
          sudo insmod tty0tty.ko
          sudo chmod 666 /dev/tnt0 /dev/tnt1
      - name: Set up uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Register Python problem matcher
        run: |
          echo "::add-matcher::.github/workflows/matchers/python.json"
      - name: Install Pytest Annotation plugin
        run: |
          . venv/bin/activate
          uv pip install pytest-github-actions-annotate-failures
      - name: Run pytest
        run: |
          . venv/bin/activate
          uv pip install pytest-xdist pytest-cov
          pytest \
            -n auto \
            -qq \
            --timeout=20 \
            --durations=10 \
            --cov=serialx \
            -o console_output_style=count \
            -p no:sugar \
            --adapter-pair /dev/tnt0,/dev/tnt1,no-pin-readback,no-flow-control,no-num-unwritten-bytes,no-reset-write-buffer,no-write-timeout,no-pause-writing-callbacks \
            tests
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          include-hidden-files: true
          path: .coverage

  pytest-macos:
    runs-on: macos-latest
    name: Run tests Python 3.13 (macOS)
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Cache Rust build
        id: cache-rust
        uses: actions/cache@v4
        with:
          path: target
          key: rust-macos-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**') }}
          restore-keys: |
            rust-macos-
      - name: Set up Rust
        if: steps.cache-rust.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          pip install -e .[dev] pytest-cov
      - name: Run tests
        run: |
          pytest --timeout=20 --cov=serialx tests
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-macos-latest
          include-hidden-files: true
          path: .coverage

  pytest-windows:
    runs-on: windows-latest
    name: Run tests Python 3.13 (Windows)
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v6
      - name: Install com0com
        shell: pwsh
        working-directory: .github
        run: |
          Invoke-WebRequest https://github.com/Apollon77/SupportingFiles/raw/a14981be47f3be872a4aec2d989ab529ba362f23/appveyor/serial/com0com.cer -OutFile com0com.cer
          Import-Certificate -FilePath com0com.cer -CertStoreLocation Cert:\LocalMachine\Root
          Import-Certificate -FilePath com0com.cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher

          Invoke-WebRequest https://github.com/Apollon77/SupportingFiles/raw/a14981be47f3be872a4aec2d989ab529ba362f23/appveyor/serial/setup_com0com_W7_x64_signed.exe -OutFile setup_com0com_W7_x64_signed.exe
          .\setup_com0com_W7_x64_signed.exe /S
      - name: Configure com0com
        shell: pwsh
        working-directory: C:\Program Files (x86)\com0com
        run: |
          .\setupc.exe --wait 1 install PortName=-,EmuBR=yes,cts=rrts,dsr=rdtr,dcd=rdtr PortName=-,EmuBR=yes,cts=rrts,dsr=rdtr,dcd=rdtr
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Cache Rust build
        id: cache-rust
        uses: actions/cache@v4
        with:
          path: target
          key: rust-windows-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**') }}
          restore-keys: |
            rust-windows-
      - name: Set up Rust
        if: steps.cache-rust.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          pip install -e .[dev] pytest-cov
      - name: Run tests
        shell: pwsh
        run: |
          python -m serialx.tools.list_ports
          pytest --timeout=20 --cov=serialx tests --adapter-pair CNCA0,CNCB0
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows-latest
          include-hidden-files: true
          path: .coverage

  coverage:
    name: Process test coverage
    runs-on: ubuntu-latest
    needs: [pytest, pytest-macos, pytest-windows]
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v6
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.10"
      - name: Restore base Python virtual environment
        id: cache-venv
        uses: actions/cache/restore@v4
        with:
          fail-on-cache-miss: true
          path: venv
          key: >-
            2-${{ runner.os }}-base-venv-3.10-${{
            hashFiles('pyproject.toml', 'Cargo.toml', 'src/lib.rs') }}
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
      - name: Combine coverage results
        run: |
          . venv/bin/activate
          pip install coverage
          coverage combine coverage*/.coverage*
          coverage report
          coverage xml
      - name: Upload coverage to Codecov
        if: ${{ github.event.repository.fork == false }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
