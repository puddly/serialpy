name: CI

on:
  push:
  pull_request: ~

jobs:
  prepare-base:
    name: Prepare base dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Restore base Python virtual environment
        id: cache-venv
        uses: actions/cache/restore@v4
        with:
          path: venv
          key: >-
            1-${{ runner.os }}-base-venv-${{
            steps.python.outputs.python-version }}-${{
            hashFiles('pyproject.toml', 'Cargo.toml', 'src/lib.rs') }}
      - name: Install system dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Set up Rust
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Create Python virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv venv
          . venv/bin/activate
          uv pip install -U pip setuptools pre-commit setuptools-rust
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 uv pip install -e .[dev]
      - name: Cache base Python virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: venv
          key: ${{ steps.cache-venv.outputs.cache-primary-key }}

  pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    needs: prepare-base
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.10"
      - name: Restore base Python virtual environment
        id: cache-venv
        uses: actions/cache/restore@v4
        with:
          fail-on-cache-miss: true
          path: venv
          key: >-
            1-${{ runner.os }}-base-venv-${{
            steps.python.outputs.python-version }}-${{
            hashFiles('pyproject.toml', 'Cargo.toml', 'src/lib.rs') }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Restore pre-commit environment from cache
        id: cache-precommit
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pre-commit
          key: |
            1-${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit dependencies
        if: steps.cache-precommit.outputs.cache-hit != 'true'
        run: |
          . venv/bin/activate
          pre-commit install-hooks
      - name: Cache pre-commit environment
        if: steps.cache-precommit.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.cache-precommit.outputs.cache-primary-key }}
      - name: Lint and static analysis
        run: |
          . venv/bin/activate
          pre-commit run --show-diff-on-failure --color=always --all-files

  pytest:
    runs-on: ubuntu-latest
    needs: prepare-base
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    name: Run tests Python ${{ matrix.python-version }} (Linux)
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Restore base Python virtual environment
        id: cache-venv
        uses: actions/cache/restore@v4
        with:
          fail-on-cache-miss: true
          path: venv
          key: >-
            1-${{ runner.os }}-base-venv-${{
            steps.python.outputs.python-version }}-${{
            hashFiles('pyproject.toml', 'Cargo.toml', 'src/lib.rs') }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y socat libudev-dev
      - name: Register Python problem matcher
        run: |
          echo "::add-matcher::.github/workflows/matchers/python.json"
      - name: Install Pytest Annotation plugin
        run: |
          . venv/bin/activate
          pip install pytest-github-actions-annotate-failures
      - name: Compile ESPHome host daemon fixture
        run: |
          . venv/bin/activate
          esphome compile tests/esphome/host_daemon.yaml
      - name: Run pytest
        run: |
          . venv/bin/activate
          pip install pytest-xdist pytest-cov
          pytest \
            -n auto \
            -qq \
            --timeout=20 \
            --durations=10 \
            --cov=serialx \
            -o console_output_style=count \
            -p no:sugar \
            tests
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          include-hidden-files: true
          path: .coverage

  pytest-macos:
    runs-on: macos-latest
    name: Run tests Python 3.13 (macOS)
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache Rust build
        id: cache-rust
        uses: actions/cache@v4
        with:
          path: target
          key: rust-macos-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**') }}
          restore-keys: |
            rust-macos-
      - name: Set up Rust
        if: steps.cache-rust.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          pip install -e .[dev] pytest-cov
      - name: Run tests
        run: |
          pytest --timeout=20 --cov=serialx tests
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-macos-latest
          include-hidden-files: true
          path: .coverage

  pytest-windows:
    runs-on: windows-latest
    name: Run tests Python 3.13 (Windows)
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4
      - name: Install com0com
        shell: pwsh
        working-directory: .github
        run: |
          Invoke-WebRequest https://github.com/Apollon77/SupportingFiles/raw/a14981be47f3be872a4aec2d989ab529ba362f23/appveyor/serial/com0com.cer -OutFile com0com.cer
          Import-Certificate -FilePath com0com.cer -CertStoreLocation Cert:\LocalMachine\Root
          Import-Certificate -FilePath com0com.cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher

          Invoke-WebRequest https://github.com/Apollon77/SupportingFiles/raw/a14981be47f3be872a4aec2d989ab529ba362f23/appveyor/serial/setup_com0com_W7_x64_signed.exe -OutFile setup_com0com_W7_x64_signed.exe
          .\setup_com0com_W7_x64_signed.exe /S
      - name: Configure com0com
        shell: pwsh
        working-directory: C:\Program Files (x86)\com0com
        run: |
          .\setupc.exe --wait 1 install PortName=-,EmuBR=yes,cts=rdtr PortName=-,EmuBR=yes,cts=rdtr
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache Rust build
        id: cache-rust
        uses: actions/cache@v4
        with:
          path: target
          key: rust-windows-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**') }}
          restore-keys: |
            rust-windows-
      - name: Set up Rust
        if: steps.cache-rust.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          pip install -e .[dev] pytest-cov
      - name: Run tests
        shell: pwsh
        run: |
          python -m serialx.tools.list_ports
          pytest --timeout=20 --cov=serialx tests --adapter-pair CNCA0:CNCB0
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows-latest
          include-hidden-files: true
          path: .coverage

  coverage:
    name: Process test coverage
    runs-on: ubuntu-latest
    needs: [pytest, pytest-macos, pytest-windows]
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.10"
      - name: Restore base Python virtual environment
        id: cache-venv
        uses: actions/cache/restore@v4
        with:
          fail-on-cache-miss: true
          path: venv
          key: >-
            1-${{ runner.os }}-base-venv-${{
            steps.python.outputs.python-version }}-${{
            hashFiles('pyproject.toml', 'Cargo.toml', 'src/lib.rs') }}
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
      - name: Combine coverage results
        run: |
          . venv/bin/activate
          pip install coverage
          coverage combine coverage*/.coverage*
          coverage report
          coverage xml
      - name: Upload coverage to Codecov
        if: ${{ github.event.repository.fork == false }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
