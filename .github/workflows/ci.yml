name: CI

on:
  push:
  pull_request: ~

jobs:
  prepare-base:
    name: Prepare base dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Restore base Python virtual environment
        id: cache-venv
        uses: actions/cache/restore@v4
        with:
          path: venv
          key: >-
            1-${{ runner.os }}-base-venv-${{
            steps.python.outputs.python-version }}-${{
            hashFiles('pyproject.toml', 'Cargo.toml', 'src/lib.rs') }}
      - name: Install system dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Set up Rust
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Create Python virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv venv
          . venv/bin/activate
          uv pip install -U pip setuptools pre-commit setuptools-rust
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 uv pip install -e .[dev]
      - name: Cache base Python virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: venv
          key: ${{ steps.cache-venv.outputs.cache-primary-key }}

  pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    needs: prepare-base
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.10"
      - name: Restore base Python virtual environment
        id: cache-venv
        uses: actions/cache/restore@v4
        with:
          fail-on-cache-miss: true
          path: venv
          key: >-
            1-${{ runner.os }}-base-venv-${{
            steps.python.outputs.python-version }}-${{
            hashFiles('pyproject.toml', 'Cargo.toml', 'src/lib.rs') }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Restore pre-commit environment from cache
        id: cache-precommit
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pre-commit
          key: |
            1-${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit dependencies
        if: steps.cache-precommit.outputs.cache-hit != 'true'
        run: |
          . venv/bin/activate
          pre-commit install-hooks
      - name: Cache pre-commit environment
        if: steps.cache-precommit.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.cache-precommit.outputs.cache-primary-key }}
      - name: Lint and static analysis
        run: |
          . venv/bin/activate
          pre-commit run --show-diff-on-failure --color=always --all-files

  pytest:
    runs-on: ubuntu-latest
    needs: prepare-base
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    name: Run tests Python ${{ matrix.python-version }} (Linux)
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Restore base Python virtual environment
        id: cache-venv
        uses: actions/cache/restore@v4
        with:
          fail-on-cache-miss: true
          path: venv
          key: >-
            1-${{ runner.os }}-base-venv-${{
            steps.python.outputs.python-version }}-${{
            hashFiles('pyproject.toml', 'Cargo.toml', 'src/lib.rs') }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y socat libudev-dev
      - name: Register Python problem matcher
        run: |
          echo "::add-matcher::.github/workflows/matchers/python.json"
      - name: Install Pytest Annotation plugin
        run: |
          . venv/bin/activate
          pip install pytest-github-actions-annotate-failures
      - name: Run pytest
        run: |
          . venv/bin/activate
          pip install pytest-xdist pytest-cov
          pytest \
            -n auto \
            -qq \
            --timeout=20 \
            --durations=10 \
            --cov=serialx \
            -o console_output_style=count \
            -p no:sugar \
            tests
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          include-hidden-files: true
          path: .coverage

  pytest-macos:
    runs-on: macos-latest
    name: Run tests Python 3.13 (macOS)
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          pip install -e .[dev] pytest-cov
      - name: Run tests
        run: |
          pytest --timeout=20 --cov=serialx tests
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-macos-latest
          include-hidden-files: true
          path: .coverage

  pytest-windows:
    runs-on: windows-latest
    name: Run tests Python 3.13 (Windows)
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4
      - name: Install and configure com0com
        shell: pwsh
        run: |
          $driverDir = Join-Path $PWD "tests/drivers/com0com"
          $inf = Join-Path $driverDir "cncport.inf"
          $setupc = Join-Path $driverDir "setupc.exe"
          $setupApiLog = Join-Path $env:windir "INF\setupapi.dev.log"
          $requiredFiles = @(
            "setupc.exe",
            "setup.dll",
            "com0com.sys",
            "com0com.inf",
            "com0com.cat",
            "cncport.inf",
            "cncport.cat",
            "comport.inf"
          )

          foreach ($name in $requiredFiles) {
            $path = Join-Path $driverDir $name
            if (-not (Test-Path $path)) {
              throw "Missing com0com asset: $name"
            }
          }

          function Show-DriverDiagnostics {
            Write-Host "=== setupapi.dev.log (tail) ==="
            if (Test-Path $setupApiLog) {
              Get-Content $setupApiLog -Tail 300
            }
            Write-Host "=== Installed drivers (filtered) ==="
            pnputil /enum-drivers | Select-String -Pattern "Published Name|Original Name|Provider Name|com0com|cncport" -Context 0,1
            Write-Host "=== Connected devices (filtered) ==="
            pnputil /enum-devices /connected | Select-String -Pattern "com0com|CNCA|CNCB|COM\d+" -Context 0,1
          }

          function Invoke-PnPUtilAddDriver {
            param(
              [string]$InfPath
            )

            $outLog = Join-Path $env:RUNNER_TEMP "pnputil-add-driver.out.log"
            $errLog = Join-Path $env:RUNNER_TEMP "pnputil-add-driver.err.log"

            $proc = Start-Process `
              -FilePath "pnputil.exe" `
              -ArgumentList @("/add-driver", $InfPath, "/install") `
              -PassThru `
              -NoNewWindow `
              -RedirectStandardOutput $outLog `
              -RedirectStandardError $errLog

            if (-not $proc.WaitForExit(180000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Write-Host "pnputil add-driver timed out"
              if (Test-Path $outLog) { Get-Content $outLog -Tail 200 }
              if (Test-Path $errLog) { Get-Content $errLog -Tail 200 }
              Show-DriverDiagnostics
              throw "pnputil add-driver timed out"
            }

            if (Test-Path $outLog) { Get-Content $outLog -Tail 200 }
            if (Test-Path $errLog) { Get-Content $errLog -Tail 200 }

            if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
              Show-DriverDiagnostics
              throw "pnputil add-driver failed with exit code $($proc.ExitCode)"
            }
          }

          function Invoke-Setupc {
            param(
              [string]$Name,
              [string[]]$Arguments
            )

            $outLog = Join-Path $env:RUNNER_TEMP "setupc-$Name.out.log"
            $errLog = Join-Path $env:RUNNER_TEMP "setupc-$Name.err.log"

            Write-Host "Running setupc [$Name]: $($Arguments -join ' ')"
            $proc = Start-Process `
              -FilePath $setupc `
              -WorkingDirectory $driverDir `
              -ArgumentList $Arguments `
              -PassThru `
              -NoNewWindow `
              -RedirectStandardOutput $outLog `
              -RedirectStandardError $errLog
            if (-not $proc.WaitForExit(180000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Write-Host "setupc [$Name] timed out"
              if (Test-Path $outLog) { Get-Content $outLog -Tail 200 }
              if (Test-Path $errLog) { Get-Content $errLog -Tail 200 }
              Show-DriverDiagnostics
              throw "setupc [$Name] timed out"
            }

            if (Test-Path $outLog) { Get-Content $outLog -Tail 200 }
            if (Test-Path $errLog) { Get-Content $errLog -Tail 200 }

            if ($proc.ExitCode -ne 0) {
              Show-DriverDiagnostics
              throw "setupc [$Name] failed with exit code $($proc.ExitCode)"
            }

            if (Test-Path $outLog) {
              return Get-Content $outLog -Raw
            }
            return ""
          }

          Invoke-PnPUtilAddDriver -InfPath $inf

          reg add HKLM\Software\Policies\Microsoft\Windows\DeviceInstall\Settings /v SuppressNewHWUI /t REG_DWORD /d 1 /f

          Push-Location $driverDir
          try {
            Invoke-Setupc -Name "install" -Arguments @("--no-update", "install", "-", "-")
            Invoke-Setupc -Name "change-cnca0" -Arguments @("change", "CNCA0", "PortName=COM#")
            Invoke-Setupc -Name "change-cncb0" -Arguments @("change", "CNCB0", "PortName=COM#")
            $listOutput = Invoke-Setupc -Name "list" -Arguments @("list")

            $leftMatch = [regex]::Match($listOutput, "CNCA0\s+PortName=(COM#|COM\d+)(?:,RealPortName=(COM\d+))?")
            $rightMatch = [regex]::Match($listOutput, "CNCB0\s+PortName=(COM#|COM\d+)(?:,RealPortName=(COM\d+))?")
            if (-not $leftMatch.Success -or -not $rightMatch.Success) {
              throw "Unable to parse CNCA0/CNCB0 from setupc list output: $listOutput"
            }

            $leftPort = if ($leftMatch.Groups[2].Value) { $leftMatch.Groups[2].Value } else { $leftMatch.Groups[1].Value }
            $rightPort = if ($rightMatch.Groups[2].Value) { $rightMatch.Groups[2].Value } else { $rightMatch.Groups[1].Value }
            if ($leftPort -eq "COM#" -or $rightPort -eq "COM#") {
              throw "setupc did not resolve real COM names: $listOutput"
            }

            "SERIALX_LEFT=\\.\$leftPort" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "SERIALX_RIGHT=\\.\$rightPort" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } finally {
            Pop-Location
            reg add HKLM\Software\Policies\Microsoft\Windows\DeviceInstall\Settings /v SuppressNewHWUI /t REG_DWORD /d 0 /f
          }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          pip install -e .[dev] pytest-cov
      - name: Run tests
        shell: pwsh
        run: |
          pytest --timeout=20 --cov=serialx tests --adapter-pair "$env:SERIALX_LEFT`:$env:SERIALX_RIGHT"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows-latest
          include-hidden-files: true
          path: .coverage

  coverage:
    name: Process test coverage
    runs-on: ubuntu-latest
    needs: [pytest, pytest-macos, pytest-windows]
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.10"
      - name: Restore base Python virtual environment
        id: cache-venv
        uses: actions/cache/restore@v4
        with:
          fail-on-cache-miss: true
          path: venv
          key: >-
            1-${{ runner.os }}-base-venv-${{
            steps.python.outputs.python-version }}-${{
            hashFiles('pyproject.toml', 'Cargo.toml', 'src/lib.rs') }}
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
      - name: Combine coverage results
        run: |
          . venv/bin/activate
          pip install coverage
          coverage combine coverage*/.coverage*
          coverage report
          coverage xml
      - name: Upload coverage to Codecov
        if: ${{ github.event.repository.fork == false }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
